# Nginx in front of the Node app. setup-server.sh replaces shop.example.com with your domain.

limit_req_zone $binary_remote_addr zone=fts_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fts_auth:10m rate=10r/m;
limit_req_status 429;

upstream feathers_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com www.shop.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://shop.example.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shop.example.com;
    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    return 301 https://shop.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 30m;   # stitching uploads (3 types × 3 images)
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Product photos straight from disk, cached for 30 days.
    location /media/ {
        alias /opt/feathers/storage/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Next.js build assets are content-hashed.
    location /_next/static/ {
        proxy_pass http://feathers_app;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/admin/auth/ {
        limit_req zone=fts_auth burst=10 nodelay;
        include /etc/nginx/snippets/feathers-proxy.conf;
    }

    location /api/ {
        limit_req zone=fts_api burst=30 nodelay;
        include /etc/nginx/snippets/feathers-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/feathers-proxy.conf;
    }
}
